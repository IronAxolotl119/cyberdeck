# GPIO pins, buzzer, and music. Pin numbers are BCM numbers (GPIO17 = 17),
# NOT physical header pin positions. See CUSTOMIZING.md for a wiring sketch.

[gpio]
# auto = pretend pins in --mode sim; on a real board gpiozero, then /sys/class/gpio
# Or force one: sim, gpiozero, sysfs
backend = auto

# Names you can use instead of numbers: `gpio led on`, `gpio read button`.
# Add as many as you like (fan = 23, red = 5, …).
[pins]
led = 17
button = 27
buzzer = 18

[buzzer]
# passive = needs a tone (can play music)   active = beeps by itself (on/off only)
type = passive

[music]
# Folder with song .txt files (relative to the project folder, or absolute)
folder = songs
# Fraction of each note left silent so repeated notes sound separate (0-0.5)
gap = 0.1

# How the deck reaches the companion pet program (see docs/TESTING_TWO_BOARDS.md).
# Command-line flags win over these: --link tcp --port 7777,
# --link serial --device /dev/ttyUSB0 --baud 115200.
[link]
# sim    = a pretend pet inside the deck (no second program needed)
# tcp    = the companion program is a TCP server (same computer, or over the network)
# serial = a UART between two Pis (or a USB-serial adapter)
# auto   = tcp if the companion is already running at host:port when the
#          deck starts, otherwise the sim pet (start the companion first)
mode = auto

# tcp: where the companion listens
host = 127.0.0.1
port = 7777

# serial: the Pi's UART is /dev/serial0; USB adapters are /dev/ttyUSB0 or /dev/ttyACM0.
# (The CYBERDECK_SERIAL environment variable also sets this.) Always 8N1.
device = /dev/serial0
baud = 115200
# auto = use pyserial if it is installed, else the built-in termios code
serial_driver = auto

# Seconds to wait for each reply before giving up
timeout = 1.5
# At startup, wait this long for the companion before showing the UI anyway
connect_wait = 2
# Longest pause between reconnect attempts (it starts at 0.5 s and doubles)
retry_max = 10
# How often to ask for the pet's status (also tells us the link is alive)
poll_seconds = 3
# Ask the companion to push events (hungry, evolved, level_up, …)
events = yes
