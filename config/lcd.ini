; ===========================================================================
; config/lcd.ini - the 16x2 character LCD (LCD1602 + PCF8574 I2C backpack)
;
; The LCD shows PULSE's blurbs between notifications (alerts, PULSE news,
; link up/down, low battery). Everything here is optional: delete a line
; and the built-in default is used. Edit, save, restart the deck.
; Wiring + setup: docs/LCD.md.  Your own PULSE lines: text/lcd_blurbs.txt.
; ===========================================================================

[lcd]
; sim  = a pretend screen, shown in the Deck & PULSE tab (any computer)
; i2c  = the real LCD on the Pi (pip install -r requirements-pi.txt)
; none = no LCD at all
; One-off override: python3 -m cyberdeck --lcd i2c
backend = sim
cols = 16
rows = 2
; Screen updates per second. Long lines scroll one character per update.
fps = 4
; Seconds a scrolling line waits before it starts moving.
scroll_pause = 1.2
; Each idle page (see [pages]) stays this long, or until its text has scrolled once.
rotate_seconds = 6
; How long a notification stays (an ALERT stays alert_hold_seconds).
hold_seconds = 6
alert_hold_seconds = 10
; Blink the backlight when a notification arrives (not during quiet hours).
flash = yes
flash_times = 3
; Chirp the buzzer (config/hardware.ini [pins] buzzer) for priority >= chirp_priority.
; Priorities: 1 info, 2 notice (PULSE news), 3 alert (evil twin, unknown tag, link down).
chirp = no
chirp_priority = 3
; auto = on, blinks for news, off in quiet hours. on / off = always. (`lcd backlight` changes it live.)
backlight = auto
; auto: switch the backlight off after this many idle minutes (0 = never).
dim_after_minutes = 0
; Also write the pretend screen to this text file (same as --lcd-sim FILE).
sim_mirror =

[i2c]
; auto = try the candidates below. Most backpacks are 0x27 (PCF8574) or 0x3F
; (PCF8574A). Check with:  i2cdetect -y 1   or   python3 -m cyberdeck.lcd --scan
address = auto
candidates = 0x27, 0x3F
; I2C bus number: 1 on every Pi since 2012 (pins 3 and 5).
port = 1
; auto = RPLCD if installed, else the tiny built-in smbus2 driver.
driver = auto
; Character ROM on the HD44780 chip: A00 (most common) or A02.
charmap = A00
expander = PCF8574

[filter]
; The same notification again within this many seconds is skipped.
dedupe_seconds = 90
; At most this many info / PULSE-news pop-ups per minute (burst = how many may
; come at once). ALERTs (evil twin, unknown tag, link down…) are never rate-dropped;
; they are already limited by [field] cooldown in dash.ini and dedupe_seconds here.
max_per_minute = 6
burst = 3
; Waiting notifications kept; when full, the least important oldest one goes.
max_queue = 8
; Field mode (f key): only notifications of this priority or higher interrupt.
field_min_priority = 3

[quiet]
; Quiet hours, in the deck's local time (on your Pi: America/Phoenix).
; Below allow_priority nothing pops up; allowed ones show without flash or chirp,
; and the backlight stays off between them.
enabled = no
start = 22:00
end = 07:00
allow_priority = 3

[pages]
; Idle rotation between notifications: pulse, blurb, clock (repeat as you like).
order = pulse, blurb, clock, blurb
; PULSE's flavour lines, grouped by mood. Edit it, then `lcd reload`.
blurb_file = text/lcd_blurbs.txt
; PULSE's recent reactions (discoveries, events) stay in the rotation this long.
reaction_minutes = 30
; Clock page, line 1 (Python strftime). 16 characters fit without scrolling.
clock_format = %a %d %b %H:%M

[notify]
; PULSE events that pop up. Everything else PULSE says (speech, idle, dream,
; greeting… from the companion's `say` lines) still shows as a blurb.
; Care and growth: hungry, tired, bored, sad, evolve_soon, evolve_choice, evolving,
;   evolved, level_up, learned_move, move_strengthened, woke, signal_found
; Companion life (companion/docs/ALIVE.md): ask, sick, tantrum, treasure,
;   adventure_return, rival_appears, birthday, hatchday, egg_hatched, suspicious
pet_events = hungry, tired, bored, sad, evolve_soon, evolve_choice, evolving, evolved, level_up, learned_move, move_strengthened, woke, signal_found, ask, sick, tantrum, treasure, adventure_return, rival_appears, birthday, hatchday, egg_hatched, suspicious
; Awareness & Diagnostics alerts (already filtered by [field] in dash.ini).
awareness_alerts = yes
; pet.discovery replies that taught / strengthened a move or levelled PULSE up.
reactions = yes
; Companion link up / down.
link_changes = yes
; Low deck battery warning, in percent (0 = off). Needs a battery gauge.
battery_low = 15
