# world.ini — weather, sun, moon, and ISS settings.
# Lines starting with # are comments. Restart the deck after editing.

[location]
# Where you are. Find coordinates on any map app (right-click -> coordinates).
# South latitudes and west longitudes are negative.
name = Phoenix, AZ
latitude = 33.4484
longitude = -112.0740
# Timezone for showing times (a tz name like America/Denver, or "local"
# to use whatever the Pi is set to).
timezone = America/Phoenix

[network]
# yes = never go online; use only what is already cached (and local maths)
offline = no
# Keep weather and ISS data fresh in the background while the deck is open
background_refresh = yes
# Seconds to wait for a website before giving up and using the cache
timeout = 12

[weather]
# fahrenheit or celsius
units = fahrenheit
# mph or kmh
wind_units = mph
# How old the cached weather may get before it is downloaded again
refresh_minutes = 30
# Days in the forecast list (1-7)
forecast_days = 3

[iss]
# Orbit data (TLE). Any satellite works: change CATNR (25544 = ISS).
tle_url = https://celestrak.org/NORAD/elements/gp.php?CATNR=25544&FORMAT=TLE
refresh_hours = 12
# Warn when the orbit data is older than this many days
warn_after_days = 7
# How far ahead to look, the lowest pass worth listing, and how many to show
search_hours = 48
min_elevation = 10
show = 6
# Ticker notice this many minutes before a visible pass (0 = off)
alert_minutes = 5
