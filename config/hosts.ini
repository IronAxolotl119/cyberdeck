# Your machines, for `net check`, `net ping`, `net port`, `ping <name>`,
# and `ssh <name>`. These are EXAMPLES — replace them with your homelab.
# Names are what you type; Tab completes them.

# name = address   ports to test (optional, comma or space separated)
#   `net check` pings every host here and tests each listed TCP port.
[hosts]
deck    = 127.0.0.1      22
router  = 192.168.1.1    53, 80, 443
nas     = 192.168.1.20   22, 80, 445
pihole  = 192.168.1.2    53, 80

# SSH shortcuts:  name = whatever you would type after "ssh"
#   ssh nas  ->  ssh pi@192.168.1.20
# Extras like -p 2222, -i ~/.ssh/deck_key, or -J jumphost work too.
[ssh]
nas     = pi@192.168.1.20
router  = admin@192.168.1.1
pihole  = pi@192.168.1.2 -p 22
