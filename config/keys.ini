# Hotkeys and the launcher menu.
# Edit these and restart the deck. Type `keys` at the prompt to see
# what is active. See CUSTOMIZING.md for the full list of options.
#
# KEY NAMES:  F1 … F12,  ctrl+<letter> (also written ^P or C-p),  esc, insert
#   Some ctrl keys are reserved because the terminal or the prompt uses
#   them (ctrl+c, d, h, i, j, m, s, q, z, a, e, l, u). The deck warns if
#   you bind one.
#
# WHAT TO RUN:  any command line (pet feed, wifi scan), or a UI action
#   that starts with a colon:
#     :launcher              open the launcher menu
#     :tab next / :tab prev  cycle tabs (from split mode this zooms in)
#     :tab pet               jump straight to a tab by name or number
#     :layout toggle         split panes <-> tabs  (also :layout split|tabs)
#     :clear  :scroll up  :scroll down  :quit

[hotkeys]
F1 = help
F2 = :launcher
F3 = pet status
F4 = :tab next
F5 = status
F6 = :layout toggle
ctrl+o = :launcher
ctrl+p = pet status
ctrl+t = :tab next
F7 = net check
F8 = todo list
ctrl+w = wifi scan
ctrl+n = note list
F9 = pet log
ctrl+g = gpio led toggle
ctrl+x = music stop
F10 = hack
F11 = dungeon
F12 = typehack

# Entries in the launcher popup (F2 / Ctrl-O / `menu`), top to bottom.
#   label = command
# End a command with "..." to put it on the prompt for you to finish
# typing instead of running it right away (e.g. note add ...).
# Delete this whole section to list every command automatically.
[launcher]
Help                  = help
Deck status           = status
System snapshot       = sys
Pet: status           = pet status
Pet: feed             = pet feed
Pet: play             = pet play
Pet: event log        = pet log
Pet: check alerts     = pet alerts
Ping companion        = ping
Add a note            = note add ...
Notes                 = note list
Add a task            = todo add ...
To-do list            = todo list
Wifi scan             = wifi scan
Wifi signal meter     = wifi meter
Network info          = net info
Check homelab hosts   = net check
Ping a host           = ping ...
SSH shortcuts         = ssh
SSH to…               = ssh ...
GPIO status           = gpio
LED toggle            = gpio led toggle
Beep                  = gpio beep
Read button           = gpio read
Songs                 = music list
Play a song           = music play ...
Play Ode to Joy       = music play ode_to_joy
Stop music            = music stop
Hack the mainframe    = hack
Typing challenge      = typehack
Typing high scores    = typehack scores
Dungeon crawl         = dungeon
Loot bag              = loot
Gift loot to PULSE    = loot gift ...
Deck mood             = mood
Visualizer on/off     = viz
Replay boot animation = boot
Weather               = weather
Sunrise and sunset    = sun
Moon phase            = moon
ISS passes            = iss
ISS visible passes    = iss visible
Where is the ISS now  = iss now
Sky panel             = :tab sky
Switch tab            = :tab next
Split / tabs          = :layout toggle
Command history       = history
Hotkey list           = keys
Clear output          = :clear
Quit                  = quit
