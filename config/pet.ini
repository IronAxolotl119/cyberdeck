# PULSE alerts and the pet event log (see `pet alerts` and `pet log`).

[alerts]
# yes = check on PULSE in the background while the deck UI is open
enabled = yes
# Seconds between checks
poll_seconds = 10
# Alert when hunger is at or ABOVE this (0-100)
hungry_at = 75
# Alert when happiness is at or BELOW this ("bored")
bored_at = 35
# Alert when energy is at or BELOW this ("tired")
tired_at = 15
# Remind again every N minutes while the problem lasts (0 = only once)
repeat_minutes = 10
# Sound on a hunger alert: none, beep, or a song name from songs/ (e.g. alert)
sound = beep

[log]
# Lines kept in data/pet_log.txt (older ones are trimmed)
max_lines = 2000

[popups]
# yes = a boxed pop-up over the deck when PULSE is about to evolve, is
# ready to pick a form, is evolving, and has evolved. Any key closes it
# (and still reaches the prompt, so it never eats your typing).
enabled = yes
# Close by itself after this many seconds (0 = wait for a key)
seconds = 10
# Pop-ups waiting in line beyond this are dropped (oldest first)
max_queue = 6

[stats]
# The PULSE STATS screen (`pet stats`, `s` on the PULSE tile, F3, or STATS
# on a battle's PULSE card). It is always 48 columns wide.
# Body rows on screen; a longer page scrolls with up/down (4-30)
rows = 13
# yes = right on the last page goes back to page 1 (and left on page 1 to the last)
wrap = yes
# yes = open on the page you were last looking at
remember_page = yes
# The first page when nothing is remembered: 1 Overview, 2 Combat, 3 Care,
# 4 Traits & Evolution, 5 Moves & Loadout, 6 Bag, 7 Battle Record, 8 Discoveries
start_page = 1
# yes = the XP / HP / EN / evolution bars are redrawn in colour from the
# raw numbers; no = show the companion's bars as they are
color_bars = yes
