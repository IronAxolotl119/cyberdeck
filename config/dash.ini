; ===========================================================================
; config/dash.ini - settings for the Rich dashboard (python3 -m cyberdeck_dash)
;
; Every value here is optional: delete a line and the built-in default is
; used. Lists are comma-separated. Times are in seconds unless the name
; says otherwise. Edit, save, restart the dashboard.
; ===========================================================================

[dash]
; Screen redraws per second. 2 is easy on a Pi Zero 2 W; 4 feels snappier.
refresh_hz = 2
; Starting theme: one of the [theme.*] sections below.
theme = neon
; sim = fake radios (any computer); real = Pi hardware backends below.
mode = sim
; Panel focused at start (any panel key; its tab opens).
start_panel = wifi
; Glitch effect on the title: 0 = off, 1 = subtle, 3 = chaotic.
glitch = 1

; ---- Tabs ----------------------------------------------------------------
; The dashboard is split into tabs ("groups"). [ and ] switch tabs; number
; keys 1-9 pick a panel inside the current tab. Panel keys: wifi, bt, lan,
; rfid, journal, diag, checklist, field, pet, system.
[tabs]
order = awareness, deck

; Defensive, personal-awareness tools only: passive listening to your own
; surroundings and your own subnet, plus everyday network diagnostics.
[tab.awareness]
title = Awareness & Diagnostics
panels = wifi, bt, lan, rfid, journal, diag, checklist
columns = 3

[tab.deck]
title = Deck & PULSE
panels = field, pet, system
columns = 3
; detail = yes: tiles show their full view (good for tabs with few panels).
detail = yes

; ---- Themes. Any Rich colour name or #rrggbb works. Press t to cycle. ----
[theme.neon]
accent = #00f0ff
accent2 = #ff2bd6
text = #c8d3f5
dim = #5a6688
good = #39ff88
warn = #ffd23f
bad = #ff3860
border = #2b3a67
focus = #ff2bd6
title_bg = #0d0221

[theme.amber]
accent = #ffb000
accent2 = #ff6a00
text = #ffd27f
dim = #7a5a20
good = #ffcc33
warn = #ff8800
bad = #ff3300
border = #5c3d00
focus = #ffe066
title_bg = #1a0f00

[theme.matrix]
accent = #00ff41
accent2 = #b6ff00
text = #9cffb0
dim = #1e6b30
good = #00ff41
warn = #d4ff00
bad = #ff2a2a
border = #0f3d1a
focus = #b6ff00
title_bg = #001a05

; ---- Scanners. backend = sim, or the real backend named per section. ----
[wifi]
; sim | nmcli | iw   (iw needs root; nmcli works as a normal user)
backend = sim
interface = wlan0
interval = 8
; A jump of this many dB between two scans is flagged.
rssi_jump_db = 15
; A network missing from this many scans in a row counts as gone.
gone_after_scans = 3
; RSSI samples kept per network for the sparkline.
history_len = 40
; Case-insensitive name fragments that get a "suspicious name" flag.
suspicious_patterns = free wifi, free_wifi, freewifi, free public, public wifi, guest, hotspot, login, airport, setup
; Your own networks: SSID = allowed BSSIDs separated by |. The same SSID
; from any other BSSID is flagged as a possible evil twin. Leave empty
; to rely only on the "same name, different security" check.
trusted = AXOLOTL_NET = aa:bb:cc:00:00:01|aa:bb:cc:00:00:02

[bluetooth]
; sim | bluetoothctl | bleak
backend = sim
interval = 10
; Seconds each real scan listens for.
listen = 5
; Alert when a brand-new device stays around at least this many minutes.
dwell_minutes = 10
; A device unseen for this long is forgotten (its dwell timer resets).
forget_after = 300
; Your own devices (MACs) never raise dwell alerts.
known = 11:22:33:44:55:66

[lan]
; sim | proc   (proc reads /proc/net/arp; add ping_sweep for a sweep)
backend = sim
interval = 20
; Ping every address on your OWN subnet to fill the ARP table. Off by default.
ping_sweep = no
; Subnet to sweep, e.g. 192.168.1.0/24. auto = guess from this machine.
subnet = auto
; Ping sweep rate limit: pings per second, and minimum seconds between sweeps.
pings_per_second = 10
sweep_cooldown = 600

[rfid]
; sim | mfrc522   (MFRC522 on SPI0; needs mfrc522 + spidev installed)
backend = sim
; Seconds between reader polls.
interval = 1
; A tag not read for this long ends its presence session.
absent_after = 4
; Known tags with notes live here (written when you add a note).
inventory = data/tags.json

[diag]
; Diagnostics panel: ping a host, DNS lookup, interface stats.
; auto = simulated in sim mode, real commands in real mode. real = always real.
backend = auto
; Pre-filled targets for the p (ping) and d (DNS) prompts.
ping_default = 192.168.1.1
dns_default = github.com

[journal]
path = data/discoveries.jsonl
; Lines loaded into memory at start.
keep = 300

[field]
; Field mode: one key (f, or the field button) starts a fast background
; scan loop and only alerts on high-interest events.
scan_interval = 4
; Minimum interest (1 low, 2 medium, 3 high) that raises an alert.
alert_interest = 3
; Outside field mode, alert from this interest level.
normal_alert_interest = 2
; The same alert (same kind + id) stays quiet for this long.
cooldown = 120
; At most this many alerts per minute, with this burst allowance.
max_alerts_per_minute = 6
burst = 3
; Minimum seconds between two manual scans (scan key / button spam guard).
manual_scan_cooldown = 3

[checklist]
; Reminders. space toggles the selected one, x resets all.
items = Phone charged, Badge / keys on me, Deck battery above 50%, Companion board linked, Wi-Fi field log started, Notes reviewed

[companion]
; Talk to the PULSE companion (companion/companion.py) over TCP.
enabled = yes
host = 127.0.0.1
port = 7777
timeout = 1.5
; Seconds between pet.status polls.
poll = 3

[xp]
; XP for first sightings, by kind. Interest adds interest_bonus per level above 1.
wifi = 4
bt = 3
lan = 3
rfid = 8
interest_bonus = 3
; Chance (0-1) per interest level that a find teaches or strengthens a move.
learn_chance = 0.12
; Environment activity (finds in the last activity_window seconds) sets mood.
activity_window = 300
busy_at = 8

[buttons]
; keyboard = simulate buttons with keys; gpiozero = real buttons (BCM pins).
backend = keyboard
; Pin numbers (BCM). Leave a value empty to skip that button.
scan = 17
use_move = 27
field = 22
next_panel = 23
; Optional 5-way joystick.
joy_up = 5
joy_down = 6
joy_left = 13
joy_right = 19
joy_press = 26
; Optional LED that blinks on alerts (empty = none).
alert_led =
