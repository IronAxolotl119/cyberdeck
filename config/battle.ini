# battle.ini — dungeon battles (FIGHT / BAG / PULSE / RUN)
#
# Walking into an enemy in the dungeon starts a turn-based battle on a
# 48-column ASCII screen. The defaults live in cyberdeck/battledata.py;
# anything you set here wins. Delete a line to go back to the default.
# How battles work and the keys: docs/BATTLE.md.

[odds]
# RUN: chance = flee_base + (PULSE speed - enemy speed) * flee_speed
#               + (PULSE level - enemy level) * flee_level,
# kept between flee_min and flee_max, then times flee_boss for a boss.
flee_base = 0.5
flee_speed = 0.05
flee_level = 0.05
flee_min = 0.10
flee_max = 0.95
flee_boss = 0.5
# Enemy attacks: a roll from attack * dmg_min up to attack, +1 every
# dmg_depth floors. smart = how often it picks the attack that hurts
# PULSE most (0 = always random, 1 = always the best one).
dmg_min = 0.5
dmg_depth = 2
smart = 0.6
# XP for a win: xp_base + xp_depth * floor (times xp_boss for a boss).
xp_base = 2
xp_depth = 3
xp_boss = 3
# Chance a beaten enemy drops an item into PULSE's battle bag.
loot = 0.4
boss_loot = 1.0
# Turns an enemy waits after you run away (or PULSE faints) before it
# can start another battle.
calm_turns = 3

# One section per enemy changes it: [enemy.<id>] with any of
#   name, glyph (map letter), face, type, weak, depth (first floor),
#   hp, attack, defense, speed (level-1 battle stats),
#   solo_hp, solo_attack (when you fight without PULSE),
#   every (bosses: every Nth floor), enabled = no (never spawn it)
# Ids: bug glitch spam virus lag worm firewall daemon kernel_panic
# Types: NORM VOLT DATA NET FIRE ICE VOID
#
# [enemy.bug]
# face = (O_O)
# hp = 22
#
# [enemy.kernel_panic]
# every = 3
