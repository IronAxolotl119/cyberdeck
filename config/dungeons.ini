; dungeons.ini — network dungeons (one per Wi-Fi / Bluetooth / LAN signal PULSE found).
;
; `dungeon` opens a picker of the dungeons the companion knows (pet.dungeons).
; With no companion, an older companion, or `enabled = no`, it opens the
; classic random dungeon instead, exactly as before. The rules and keys are in
; docs/DUNGEONS.md; the protocol is companion/docs/DUNGEON_INTEGRATION.md
; ("Network dungeons"). Every value is optional: delete a line for the default.

[dungeons]
; yes = `dungeon` shows network dungeons when the companion has them.
enabled = yes
; A "classic dungeon" row at the bottom of the picker (c works either way).
classic_row = yes
; The most dungeon rows the picker shows at once, 3-40 (fewer when the screen
; is short; the list scrolls).
picker_rows = 20
; How far you can see on a dark floor (lit floors: 7), 1-7.
dark_sight = 3
; A trap's hit on you (+1 every 4 floors), 0-20.
trap_damage = 2
; One ! repair kit per floor for you (or PULSE, whoever is more hurt).
repair_kits = yes
; Share of floor pickups that are data chests ($, extra XP for PULSE) instead
; of bag items (*), 0.0-1.0. A chest is worth chest_xp + the floor number.
chest_chance = 0.3
chest_xp = 3
; Colours: palette = the dungeon's own colours ([palettes] below),
; theme = your theme's title/dim colours, off = plain text.
colors = palette
; yes = walls and floors use the dungeon's own characters (e.g. % and .).
glyphs = yes

[alerts]
; "NEW DUNGEON: name" in the console and the pet log. The LCD pop-up is
; config/lcd.ini [notify] pet_events (dungeon_found, dungeons_found).
console = yes

[map]
; The biggest floor the deck builds, whatever the companion asks for.
; Bigger maps scroll. Bad or missing companion numbers fall back to defaults.
max_width = 80
max_height = 24
max_rooms = 12
max_traps = 8
max_items = 8
max_loops = 4

[palettes]
; palette name = wall colour, floor colour (hex). The companion picks the
; palette name for each dungeon; change the colours here. Examples:
; cyan_grid = 2bd9e8, 1c7f88
; violet_null = b07cff, 64459a
