# Network feature settings: wifi scanning, host checks, ssh.
# Hosts and ssh shortcuts themselves are in hosts.ini.

[wifi]
# Where scans come from: auto, nmcli, iw, or sim
#   auto = sim in --mode sim; on a real board nmcli, then iw
backend = auto
# The wifi interface name (see `ip link`)
interface = wlan0
# Seconds between readings in `wifi meter`
meter_interval = 0.5

[net]
# Interface for the net panel and `net info` highlight; auto = default route
interface = auto
# Seconds to wait for a ping reply
ping_timeout = 1.0
# Seconds to wait for a TCP port to answer
port_timeout = 0.8
# How many hosts/ports to check at the same time
workers = 8

[ssh]
# The ssh program, and options added to every connection
binary = ssh
options = -o ConnectTimeout=8
