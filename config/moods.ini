# The deck's moods: what it says on the ticker line (row 3 of the screen).
# Checked TOP TO BOTTOM; the first section whose `when` is true wins.
#
#   when     = battery < 15   (also <= > >=; metrics: battery temp cpu mem wifi)
#              or: charging, pet_alert, always
#   role     = dim, text, ok, warn, alert, title   (the color)
#   messages = one per line, indented under "messages ="
#              placeholders: {bat} {temp} {cpu} {mem} {wifi} {ssid} {host}
#
# Type `mood` to see what the deck says right now, `mood reload` after editing.

[battery_critical]
when = battery < 8
role = alert
messages =
    {bat}% battery. this is my final form. plug. me. in.
    i can see the light... it's the low-battery LED.
    tell PULSE i loved it. ({bat}%)

[overheating]
when = temp >= 70
role = alert
messages =
    {temp}°C. i am literally a toaster right now.
    thermal throttling is just me taking a nap. {temp}°C.
    who put me in the sun?? {temp}°C

[battery_low]
when = battery < 20
role = warn
messages =
    running on fumes here. {bat}% left.
    battery at {bat}%. this is fine. everything is fine.
    i'd love a charger. no pressure. ({bat}%)

[warm]
when = temp >= 62
role = warn
messages =
    getting a little toasty in here ({temp}°C)
    is it hot in here or is it just my CPU? {temp}°C

[cpu_busy]
when = cpu >= 80
role = warn
messages =
    {cpu}% cpu. i'm working, i'm working!
    so many cycles, so little time.

[pet_needs_you]
when = pet_alert
role = warn
messages =
    PULSE keeps pinging me. go check on it.
    someone on the companion board needs attention.

[wifi_weak]
when = wifi < -78
role = warn
messages =
    wifi is {wifi}dBm. i can barely hear {ssid}.
    signal so weak it's basically a rumor.

[charging]
when = charging
role = ok
messages =
    ahh, sweet sweet electrons. ({bat}%)
    charging up. feeling dangerous.

[idle]
when = always
role = dim
messages =
    all systems nominal. {temp}°C · {bat}%
    waiting for orders, operator.
    the grid is quiet tonight.
    hack the planet.
