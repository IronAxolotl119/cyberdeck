# Layout for the full-screen terminal UI.
# Edit these and restart the deck. See CUSTOMIZING.md for more.

[layout]
# Text in the top-left of the status frame
title = CYBERDECK / MAIN

# Text shown before the cursor on the command line
prompt = "> "

# strftime format for the clock in the status bar
clock_format = %H:%M:%S

# Below this size the UI shows a "terminal too small" message
min_cols = 40
min_rows = 8

# How many log lines to keep in the output pane
max_output_lines = 500

# Box-drawing characters: auto, yes, or no (no = plain ASCII + - |)
use_unicode = auto
