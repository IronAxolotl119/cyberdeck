# Layout for the full-screen terminal UI.
# Edit these and restart the deck. See CUSTOMIZING.md for more.

[layout]
# Text in the top-left of the status frame
title = CYBERDECK / MAIN

# Text shown before the cursor on the command line
prompt = "> "

# strftime format for the clock in the status bar
clock_format = %H:%M:%S

# Below this size the UI shows a "terminal too small" message
min_cols = 40
min_rows = 8

# How many log lines to keep in the output pane
max_output_lines = 500

# Box-drawing characters: auto, yes, or no (no = plain ASCII + - |)
use_unicode = auto

# How many commands to remember for Up/Down (saved in data/history.txt).
# Start a command with a space to keep it OUT of the history.
[history]
size = 500

# The body of the screen: split panes side by side, or tabs.
[panes]
# split = output on the left, live panels stacked on the right
# tabs  = one view at a time, full width (switch with F4 / Ctrl-T / `view`)
mode = split

# Panels in the right-hand column for split mode, top to bottom.
# Built in: pet, system, net, todo  (more appear as features are added; see CUSTOMIZING.md)
side = pet, system

# Width of the right-hand column, in characters
side_width = 30

# If the terminal is narrower than this, split mode falls back to tabs
min_split_cols = 72

# Tabs, in order, for tabs mode ("output" is the command log)
tabs = output, pet, system, net, todo

# The second status line (notices, deck mood, visualizer): yes or no
ticker = yes

# Hotkey reminders on the bottom border: yes or no
hints = yes

# Seconds between pet panel refreshes
pet_refresh = 3

# Turn off whole built-in features by module name (see cyberdeck/features/).
[features]
disabled =
