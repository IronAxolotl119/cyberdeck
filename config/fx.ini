# Effects and fun stuff: boot animation, visualizer, moods, hacker modes.

[boot]
# Show the boot animation when the deck starts: yes or no (--no-boot skips it once)
enabled = yes
# Length in seconds (any key skips)
duration = 3.5
# How glitchy the logo starts, 0 (clean) to 1 (chaos)
glitch = 0.35
# The big logo text (letters A-Z, 0-1, ! / - and spaces)
title = CYBERDECK
# Song from songs/ to play on the buzzer at boot, or none
jingle = boot_jingle

[visualizer]
# The animated bars on the right of the ticker line: yes or no (`viz` toggles)
enabled = yes
# Number of bars
width = 12
# How lively it is when no music is playing, 0-1
idle = 0.35
# Redraw speed in milliseconds while the visualizer is on (bigger = lighter on the CPU)
frame_ms = 150

[moods]
# Sassy status lines from moods.ini: yes or no
enabled = yes
file = moods.ini
# Seconds before switching to another message of the same mood
rotate_seconds = 20

[mainframe]
# The `hack` show: what you are "breaking into", and how long it takes (seconds)
target = GIBSON MAINFRAME
duration = 12

[typing]
# The typing challenge (`typehack`): phrases file in text/, rounds, seconds per round
phrases = text/hack_phrases.txt
rounds = 3
time_limit = 30
# Name saved with your high scores
player = OPERATOR

[dungeon]
# The dungeon crawl (`dungeon`): map size and starting health
width = 56
height = 17
hp = 20
# PULSE joins you as a party member with its real stats from the
# companion (pet.combat.*). If the link is down you play solo.
pulse = yes
# ask = you pick PULSE's move each round (1-9, space = auto, . = skip)
# auto = PULSE picks its strongest move it has the energy for
pulse_moves = ask
# Chance (0-1) that a monster next to you attacks PULSE instead of you
pulse_target_chance = 0.35
# Battles: walking into an enemy opens the turn-based battle screen
# (FIGHT / BAG / PULSE / RUN, see docs/BATTLE.md). Needs `pulse = yes`
# and a linked companion; otherwise you fight on the map like before.
# no = always the old crawl. Odds and enemies live in config/battle.ini.
battle = yes
