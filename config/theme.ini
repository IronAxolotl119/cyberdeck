# Colors for the full-screen terminal UI.
# Edit these and restart the deck. Names are standard curses colors:
#   black, red, green, yellow, blue, magenta, cyan, white
# or "default" for the terminal's own background/text color.
#
# See CUSTOMIZING.md for more.

[colors]
background = black
frame = cyan
title = cyan
status = white
text = green
prompt = yellow
warn = yellow
alert = red
ok = green
dim = white
